name: Preparar pré-release em rascunho
on:
  workflow_dispatch:
    inputs:
      commit:
        description: SHA completo do commit aprovado (40 caracteres)
        required: true
permissions:
  contents: read
concurrency:
  group: release-draft
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: Conferir commit e versão
        shell: bash
        env:
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: |
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          node -e "const p=require('./package.json'),l=require('./package-lock.json'); if(p.version!=='1.0.0-beta.1'||l.version!==p.version||l.packages[''].version!==p.version) process.exit(1)"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run dist:linux
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Conferir metadados deb
        shell: bash
        run: |
          file=dist/meu-dinheiro-1.0.0-beta.1-linux-x64.deb
          test "$(dpkg-deb -f "$file" Package)" = meu-dinheiro-app
          test "$(dpkg-deb -f "$file" Version)" = 1.0.0~beta.1
          test "$(dpkg-deb -f "$file" Architecture)" = amd64
      - uses: actions/upload-artifact@v4
        with:
          name: installer-linux
          path: dist/meu-dinheiro-1.0.0-beta.1-linux-x64.deb
          if-no-files-found: error
  draft:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: release-assets
          merge-multiple: true
      - name: Conferir artefatos e preparar notas e SHA-256
        env:
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: node scripts/prepare-release.mjs
      - name: Criar somente rascunho (sem substituir release existente)
        uses: actions/github-script@v7
        env:
          RELEASE_COMMIT: ${{ inputs.commit }}
        with:
          script: |
            const fs = require('node:fs');
            const tag = 'v1.0.0-beta.1';
            const { owner, repo } = context.repo;
            // Não reutilizar tag, mesmo que coincida com o commit solicitado.
            try {
              await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
              throw new Error('Tag existente: revisão manual necessária');
            } catch (error) { if (error.status !== 404) throw error; }
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo });
            if (releases.some(r => r.tag_name === tag)) throw new Error('Release existente');
            const { data: release } = await github.rest.repos.createRelease({
              owner, repo, tag_name: tag, target_commitish: process.env.RELEASE_COMMIT,
              name: `Meu Dinheiro ${tag}`, draft: true, prerelease: true,
              body: fs.readFileSync('release-assets/RELEASE-NOTES.md', 'utf8')
            });
            for (const name of fs.readdirSync('release-assets')) {
              await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id: release.id, name,
                data: fs.readFileSync(`release-assets/${name}`)
              });
            }
            const { data: result } = await github.rest.repos.getRelease({ owner, repo, release_id: release.id });
            if (!result.draft || !result.prerelease || result.tag_name !== tag || result.target_commitish !== process.env.RELEASE_COMMIT)
              throw new Error('Metadados inesperados no rascunho');
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { owner, repo, release_id: release.id });
            const crypto = require('node:crypto');
            for (const asset of assets) {
              const bytes = fs.readFileSync(`release-assets/${asset.name}`);
              if (asset.size !== bytes.length || asset.digest !== `sha256:${crypto.createHash('sha256').update(bytes).digest('hex')}`)
                throw new Error(`Integridade divergente: ${asset.name}`);
            }
            if (assets.length !== 3) throw new Error('Conjunto de assets incompleto');
